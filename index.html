<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow task management application">
    <title>TaskFlow</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<section class="panel">
    <form id="task-form" class="task-form">
        <label for="task-input">کار جدید</label>

        <div class="input-row">
            <input
                id="task-input"
                type="text"
                maxlength="80"
                placeholder="مثلاً تکمیل گزارش آزمایش..."
                autocomplete="off"
                required
            >

            <button type="submit" class="primary-button">
                افزودن
            </button>
        </div>

        <p id="form-error" class="error-message" hidden></p>
    </form>
</section>

<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">آزمایش اول مهندسی نرم‌افزار</p>
                <h1>TaskFlow</h1>
                <p class="subtitle">مدیریت ساده کارهای روزانه</p>
            </div>
        </header>
    </main>
</body>
</html>
