<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TaskFlow - Simple task manager for Software Engineering Lab"
    >

    <title>TaskFlow</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>

    <main class="app-shell">

        <!-- Header -->
        <header class="app-header">

            <div>
                <p class="eyebrow">
                    آزمایش اول مهندسی نرم‌افزار
                </p>

                <h1>TaskFlow</h1>

                <p class="subtitle">
                    مدیریت ساده کارهای روزانه
                </p>
            </div>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="تغییر تم"
            >
                🌙
            </button>

        </header>


        <!-- Main panel -->
        <section class="panel">

            <!-- Add task form -->
            <form id="task-form" class="task-form">

                <label for="task-input">
                    کار جدید
                </label>

                <div class="input-row">

                    <input
                        id="task-input"
                        type="text"
                        maxlength="80"
                        placeholder="مثلاً تکمیل گزارش آزمایش..."
                        autocomplete="off"
                        required
                    >

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        افزودن
                    </button>

                </div>

                <p
                    id="form-error"
                    class="error-message"
                    hidden
                ></p>

            </form>


            <!-- Statistics -->
            <div class="stats">

                <article>
                    <strong id="total-count">0</strong>
                    <span>کل کارها</span>
                </article>

                <article>
                    <strong id="active-count">0</strong>
                    <span>در حال انجام</span>
                </article>

                <article>
                    <strong id="completed-count">0</strong>
                    <span>تکمیل شده</span>
                </article>

            </div>


            <!-- Filters -->
            <div class="toolbar">

                <div class="filters">

                    <button
                        type="button"
                        class="filter-button active"
                        data-filter="all"
                    >
                        همه
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="active"
                    >
                        فعال
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="completed"
                    >
                        انجام شده
                    </button>

                </div>

                <button
                    id="clear-completed"
                    class="clear-button"
                    type="button"
                >
                    حذف انجام‌شده‌ها
                </button>

            </div>


            <!-- Task list -->
            <ul
                id="task-list"
                class="task-list"
            ></ul>

            <p
                id="empty-state"
                class="empty-state"
            >
                هنوز کاری ثبت نشده است.
            </p>

        </section>

    </main>

</body>
</html>
